# Sales KPI Data Model Specification
# This is the SOURCE OF TRUTH for the canonical data model
# Edit this file to modify entities, fields, and relationships
# The graph.json and .mmd files are generated from this spec
#
# IMPORTANT: Field mappings from Odoo are documented in:
# - /app/backend/services/data_modeling/odoo_field_mappings.json (precise mappings)
# - /app/docs/ODOO_SCHEMA_REFERENCE.md (comprehensive reference)
#
# Last Updated: Auto-generated from 15 official Odoo model documentation PDFs

version: "1.0"
name: "Sales KPI Model"
description: "Canonical data model for Sales CRM data from Odoo and other sources"

# ============================================================
# ENTITIES
# ============================================================
entities:
  
  # --- Sales User (Salesperson) ---
  sales_user:
    label: "Sales User"
    description: "Salesperson/User who manages accounts and opportunities"
    source_models:
      - res.users
    primary_key:
      - org_id
      - source_system
      - source_record_id
    fields:
      canonical_id:
        type: string
        required: true
        description: "Unique identifier: {source_system}_{entity}_{source_record_id}"
      org_id:
        type: string
        required: true
        description: "Organization/tenant ID"
      source_system:
        type: string
        required: true
        description: "Source system (e.g., odoo, salesforce)"
      source_record_id:
        type: string
        required: true
        description: "Original record ID in source system"
      name:
        type: string
        required: true
        description: "User's display name"
      email:
        type: string
        required: false
        description: "User's email address"
      login:
        type: string
        required: false
        description: "Login/username"
      active:
        type: boolean
        required: false
        default: true
        description: "Is user active?"
      team_id:
        type: string
        required: false
        description: "FK to sales_team"
      created_at:
        type: datetime
        required: false
      updated_at:
        type: datetime
        required: false

  # --- Sales Team ---
  sales_team:
    label: "Sales Team"
    description: "Team of salespeople managing opportunities"
    source_models:
      - crm.team
    primary_key:
      - org_id
      - source_system
      - source_record_id
    fields:
      canonical_id:
        type: string
        required: true
      org_id:
        type: string
        required: true
      source_system:
        type: string
        required: true
      source_record_id:
        type: string
        required: true
      name:
        type: string
        required: true
        description: "Team name"
      use_opportunities:
        type: boolean
        required: false
        description: "Does team use opportunities pipeline?"
      use_leads:
        type: boolean
        required: false
        description: "Does team use leads?"
      alias_name:
        type: string
        required: false
        description: "Email alias for the team"
      invoiced:
        type: number
        required: false
        description: "Total invoiced amount"
      invoiced_target:
        type: number
        required: false
        description: "Target invoiced amount"
      member_ids:
        type: array
        items: string
        required: false
        description: "List of member user IDs"
      active:
        type: boolean
        required: false
        default: true
      created_at:
        type: datetime
        required: false
      updated_at:
        type: datetime
        required: false

  # --- Account (Company/Organization) ---
  # NOTE: In Odoo, res.partner stores BOTH companies and contacts
  # For Accounts (companies): filter where is_company = True
  # This is NOT the same as Odoo's "account.*" models which are for Finance/Accounting!
  account:
    label: "Account"
    description: "Company or organization (customer/prospect) - from res.partner where is_company=True"
    source_models:
      - res.partner  # Filter: is_company = True
    source_filter: "is_company = True"
    primary_key:
      - org_id
      - source_system
      - source_record_id
    fields:
      canonical_id:
        type: string
        required: true
      org_id:
        type: string
        required: true
      source_system:
        type: string
        required: true
      source_record_id:
        type: string
        required: true
      name:
        type: string
        required: true
        description: "Account/Company name"
      industry:
        type: string
        required: false
      type:
        type: string
        required: false
        description: "Account type (customer, vendor, etc.)"
      phone:
        type: string
        required: false
      website:
        type: string
        required: false
      email:
        type: string
        required: false
      address:
        type: string
        required: false
      city:
        type: string
        required: false
      state:
        type: string
        required: false
      zip:
        type: string
        required: false
      country:
        type: string
        required: false
      owner_id:
        type: string
        required: false
        description: "FK to sales_user (account manager)"
      owner_name:
        type: string
        required: false
      currency:
        type: string
        required: false
        default: "USD"
      customer_rank:
        type: integer
        required: false
        description: "Customer ranking score"
      active:
        type: boolean
        required: false
        default: true
      created_at:
        type: datetime
        required: false
      updated_at:
        type: datetime
        required: false

  # --- Contact (Person) ---
  # NOTE: In Odoo, res.partner stores BOTH companies and contacts
  # For Contacts (people): filter where is_company = False
  # parent_id links to the parent company (Account)
  contact:
    label: "Contact"
    description: "Individual person/contact at an account - from res.partner where is_company=False"
    source_models:
      - res.partner  # Filter: is_company = False
    source_filter: "is_company = False"
    primary_key:
      - org_id
      - source_system
      - source_record_id
    fields:
      canonical_id:
        type: string
        required: true
      org_id:
        type: string
        required: true
      source_system:
        type: string
        required: true
      source_record_id:
        type: string
        required: true
      name:
        type: string
        required: true
      email:
        type: string
        required: false
      phone:
        type: string
        required: false
      mobile:
        type: string
        required: false
      title:
        type: string
        required: false
        description: "Job title"
      function:
        type: string
        required: false
        description: "Job function/role"
      account_id:
        type: string
        required: false
        description: "FK to account (parent company)"
      account_name:
        type: string
        required: false
      active:
        type: boolean
        required: false
        default: true
      created_at:
        type: datetime
        required: false
      updated_at:
        type: datetime
        required: false

  # --- Opportunity ---
  # NOTE: crm.lead in Odoo stores BOTH leads and opportunities
  # Opportunities have more complete data and are in the pipeline
  # Many custom fields (x_studio_*) are specific to Securado's Odoo instance
  opportunity:
    label: "Opportunity"
    description: "Sales opportunity/deal in the pipeline"
    source_models:
      - crm.lead
    primary_key:
      - org_id
      - source_system
      - source_record_id
    fields:
      # === Core Identity Fields ===
      canonical_id:
        type: string
        required: true
      org_id:
        type: string
        required: true
      source_system:
        type: string
        required: true
      source_record_id:
        type: string
        required: true
      
      # === Basic Opportunity Info ===
      name:
        type: string
        required: true
        description: "Opportunity name/title"
        source_field: name
      opportunity_number:
        type: string
        required: false
        description: "Opportunity reference number (e.g., SEC/OPP/2026/01/08242)"
        source_field: x_studio_opportunity_number
      description:
        type: string
        required: false
        description: "Notes/description (HTML from Odoo)"
        source_field: description
      descriptions:
        type: string
        required: false
        description: "Additional descriptions"
        source_field: x_studio_descriptions
      priority:
        type: string
        required: false
        description: "Priority level (0-3)"
        source_field: priority
      
      # === Account/Customer Info ===
      account_id:
        type: string
        required: false
        description: "FK to account"
        source_field: partner_id
      account_name:
        type: string
        required: false
        source_field: partner_id
      customer_name:
        type: string
        required: false
        description: "Company name from partner"
        source_field: partner_name
      
      # === Contact Info ===
      contact_id:
        type: string
        required: false
        description: "FK to contact"
        source_field: contact_id
      contact_name:
        type: string
        required: false
        source_field: contact_name
      contact_email:
        type: string
        required: false
        source_field: email_from
      contact_phone:
        type: string
        required: false
        source_field: phone
      contact_mobile:
        type: string
        required: false
        source_field: contact_mobile
      contact_job_position:
        type: string
        required: false
        source_field: contact_jobposition
      
      # === Sales Team/Owner ===
      owner_id:
        type: string
        required: false
        description: "FK to sales_user (salesperson)"
        source_field: user_id
      owner_name:
        type: string
        required: false
        source_field: user_id
      team_id:
        type: string
        required: false
        description: "FK to sales_team"
        source_field: team_id
      
      # === Pipeline/Stage Info ===
      stage:
        type: string
        required: false
        description: "Pipeline stage name (from standard stage_id)"
        source_field: stage_id
      stage_id:
        type: string
        required: false
        description: "Pipeline stage ID"
        source_field: stage_id
      custom_stage:
        type: string
        required: false
        description: "Custom stage name (from x_studio_opportunity_stages_1)"
        source_field: x_studio_opportunity_stages_1
      custom_stage_id:
        type: string
        required: false
        description: "Custom stage ID"
        source_field: x_studio_opportunity_stages_1
      
      # === Financial Info ===
      probability:
        type: number
        required: false
        description: "Calculated probability from Odoo AI"
        source_field: probability
      user_probability:
        type: number
        required: false
        description: "User-input probability (salesperson's estimate)"
        source_field: probabilitynew
      automated_probability:
        type: number
        required: false
        description: "AI-calculated probability"
        source_field: automated_probability
      amount:
        type: number
        required: false
        description: "Expected revenue/deal value"
        source_field: expected_revenue
      sale_value:
        type: number
        required: false
        description: "Sale value (custom field)"
        source_field: x_studio_sale_value
      budget_value:
        type: number
        required: false
        description: "Budget value"
        source_field: x_studio_budget_value
      recurring_revenue:
        type: number
        required: false
        description: "Recurring revenue amount"
        source_field: recurring_revenue
      currency:
        type: string
        required: false
        default: "OMR"
      
      # === Status/Flags ===
      is_closed:
        type: boolean
        required: false
        default: false
      is_won:
        type: boolean
        required: false
        default: false
      active:
        type: boolean
        required: false
        default: true
        source_field: active
      
      # === Dates ===
      date_open:
        type: datetime
        required: false
        description: "Date opportunity was opened/assigned"
        source_field: date_open
      close_date:
        type: date
        required: false
        description: "Expected/actual close date"
        source_field: date_deadline
      date_closed:
        type: datetime
        required: false
        description: "Actual close date"
        source_field: date_closed
      create_date:
        type: datetime
        required: false
        source_field: create_date
      
      # === Buyers/Stakeholders (Custom Fields) ===
      technical_buyer_id:
        type: string
        required: false
        description: "Technical buyer contact"
        source_field: techbuyer
      technical_buyer_name:
        type: string
        required: false
        source_field: techbuyer
      commercial_buyer_id:
        type: string
        required: false
        description: "Commercial buyer contact"
        source_field: commbuyer
      commercial_buyer_name:
        type: string
        required: false
        source_field: commbuyer
      is_tech_buyer_coach:
        type: boolean
        required: false
        source_field: x_studio_is_a_technical_buyer
      is_comm_buyer_coach:
        type: boolean
        required: false
        source_field: x_studio_is_a_commercial_buyer
      
      # === Tender/RFP Fields (Custom) ===
      is_tender:
        type: string
        required: false
        description: "Is this a tender?"
        source_field: x_studio_is_it_a_tender
      rfp_invited:
        type: boolean
        required: false
        description: "RFP/RFQ Invited"
        source_field: x_studio_rfprfq_invited
      assisted_in_rfp:
        type: boolean
        required: false
        source_field: x_studio_assisted_in_rfp
      tender_purchase_deadline:
        type: date
        required: false
        source_field: x_studio_tender_purchase_end_date
      query_submission_deadline:
        type: date
        required: false
        source_field: x_studio_query_submission_date
      tender_submission_deadline:
        type: date
        required: false
        source_field: x_studio_tender_submission_date
      is_bid_bond_needed:
        type: string
        required: false
        source_field: x_studio_is_bid_bond_needed
      
      # === Budget/Pledge (Custom) ===
      budget_status:
        type: string
        required: false
        description: "Budget Status (Development and Approval, etc.)"
        source_field: x_studio_budget_status
      pledge:
        type: string
        required: false
        description: "Pledge (No Commitment, etc.)"
        source_field: x_studio_pledge
      
      # === POC/Demo (Custom) ===
      poc_demo_done:
        type: boolean
        required: false
        description: "POC/Demo done successfully"
        source_field: x_studio_poc_demo_done_successfully
      poc_demo_date:
        type: datetime
        required: false
        source_field: x_studio_poc_demo_date
      
      # === Competition (Custom) ===
      competitor_solution:
        type: string
        required: false
        description: "Competitor's solution details"
        source_field: x_studio_competitors_details_sales
      competitor_price:
        type: string
        required: false
        description: "Competitor's price details"
        source_field: x_studio_competitors_details_tech_sales
      
      # === Products/Services (Custom) ===
      product_service_class:
        type: string
        required: false
        source_field: x_studio_product_service_class
      deal_type:
        type: string
        required: false
        description: "Type of enquiry"
        source_field: x_studio_deal_type
      segment:
        type: string
        required: false
        source_field: x_studio_segment
      customer_type:
        type: string
        required: false
        source_field: x_studio_customer_type
      
      # === Lost Info ===
      lost_reason:
        type: string
        required: false
        source_field: lost_reason_id
      lost_reason_detail:
        type: string
        required: false
        source_field: x_studio_lost_reason
      
      # === Related Records ===
      activity_ids:
        type: array
        items: string
        required: false
        description: "List of related activity IDs"
      invoice_ids:
        type: array
        items: string
        required: false
        description: "List of related invoice IDs"
      task_ids:
        type: array
        items: string
        required: false
        description: "List of related task IDs"
      
      # === Timestamps ===
      created_at:
        type: datetime
        required: false
      updated_at:
        type: datetime
        required: false

  # --- Activity ---
  activity:
    label: "Activity"
    description: "Activity/task linked to an opportunity or account"
    source_models:
      - mail.activity
    primary_key:
      - org_id
      - source_system
      - source_record_id
    fields:
      canonical_id:
        type: string
        required: true
      org_id:
        type: string
        required: true
      source_system:
        type: string
        required: true
      source_record_id:
        type: string
        required: true
      summary:
        type: string
        required: false
        description: "Activity summary/subject"
      activity_type:
        type: string
        required: false
        description: "Type of activity (call, meeting, email, etc.)"
      note:
        type: string
        required: false
        description: "Activity notes"
      date_deadline:
        type: date
        required: false
      opportunity_id:
        type: string
        required: false
        description: "FK to opportunity"
      account_id:
        type: string
        required: false
        description: "FK to account"
      user_id:
        type: string
        required: false
        description: "FK to sales_user (assigned to)"
      state:
        type: string
        required: false
        description: "Activity state (planned, done, cancelled)"
      created_at:
        type: datetime
        required: false
      updated_at:
        type: datetime
        required: false

  # --- Invoice ---
  # NOTE: In Odoo, account.move is the JOURNAL ENTRY model
  # For Customer Invoices: filter where move_type = 'out_invoice'
  # For Vendor Bills: move_type = 'in_invoice'
  # For Credit Notes: move_type = 'out_refund' or 'in_refund'
  invoice:
    label: "Invoice"
    description: "Customer invoice - from account.move where move_type='out_invoice'"
    source_models:
      - account.move  # Filter: move_type IN ('out_invoice', 'out_refund')
    source_filter: "move_type IN ('out_invoice', 'out_refund')"
    primary_key:
      - org_id
      - source_system
      - source_record_id
    fields:
      canonical_id:
        type: string
        required: true
      org_id:
        type: string
        required: true
      source_system:
        type: string
        required: true
      source_record_id:
        type: string
        required: true
      invoice_number:
        type: string
        required: false
        description: "Invoice number (e.g., INV/2026/0001)"
      account_id:
        type: string
        required: false
        description: "FK to account (customer)"
      account_name:
        type: string
        required: false
      opportunity_id:
        type: string
        required: false
        description: "FK to opportunity (if linked)"
      invoice_date:
        type: date
        required: false
      due_date:
        type: date
        required: false
      amount_untaxed:
        type: number
        required: false
      amount_tax:
        type: number
        required: false
      amount_total:
        type: number
        required: false
      currency:
        type: string
        required: false
        default: "USD"
      state:
        type: string
        required: false
        description: "draft, posted, cancel"
      payment_state:
        type: string
        required: false
        description: "not_paid, in_payment, paid"
      created_at:
        type: datetime
        required: false
      updated_at:
        type: datetime
        required: false

  # --- Task ---
  task:
    label: "Task"
    description: "Project task/to-do item"
    source_models:
      - project.task
    primary_key:
      - org_id
      - source_system
      - source_record_id
    fields:
      canonical_id:
        type: string
        required: true
      org_id:
        type: string
        required: true
      source_system:
        type: string
        required: true
      source_record_id:
        type: string
        required: true
      name:
        type: string
        required: true
        description: "Task name/title"
      description:
        type: string
        required: false
      project_id:
        type: string
        required: false
        description: "FK to project"
      project_name:
        type: string
        required: false
      opportunity_id:
        type: string
        required: false
        description: "FK to opportunity (if linked)"
      assignee_id:
        type: string
        required: false
        description: "FK to employee/user assigned"
      assignee_name:
        type: string
        required: false
      stage:
        type: string
        required: false
      priority:
        type: string
        required: false
      date_deadline:
        type: date
        required: false
      planned_hours:
        type: number
        required: false
      effective_hours:
        type: number
        required: false
      state:
        type: string
        required: false
        description: "Task state"
      created_at:
        type: datetime
        required: false
      updated_at:
        type: datetime
        required: false

  # --- Employee ---
  employee:
    label: "Employee"
    description: "HR Employee record"
    source_models:
      - hr.employee
    primary_key:
      - org_id
      - source_system
      - source_record_id
    fields:
      canonical_id:
        type: string
        required: true
      org_id:
        type: string
        required: true
      source_system:
        type: string
        required: true
      source_record_id:
        type: string
        required: true
      name:
        type: string
        required: true
      email:
        type: string
        required: false
      work_phone:
        type: string
        required: false
      mobile_phone:
        type: string
        required: false
      job_title:
        type: string
        required: false
      department_id:
        type: string
        required: false
      department_name:
        type: string
        required: false
      manager_id:
        type: string
        required: false
        description: "FK to employee (manager)"
      user_id:
        type: string
        required: false
        description: "FK to sales_user (linked system user)"
      active:
        type: boolean
        required: false
        default: true
      created_at:
        type: datetime
        required: false
      updated_at:
        type: datetime
        required: false

  # --- Log Message ---
  # Odoo Chatter/Activity Log messages from mail.message
  # Filter where model = 'crm.lead' for opportunity-related messages
  log_message:
    label: "Log Message"
    description: "Chatter log messages - from mail.message where model='crm.lead'"
    source_models:
      - mail.message
    source_filter: "model = 'crm.lead'"
    primary_key:
      - org_id
      - source_system
      - source_record_id
    fields:
      canonical_id:
        type: string
        required: true
      org_id:
        type: string
        required: true
      source_system:
        type: string
        required: true
      source_record_id:
        type: string
        required: true
      opportunity_id:
        type: string
        required: false
        description: "FK to opportunity (res_id from mail.message)"
        source_field: res_id
      body:
        type: string
        required: false
        description: "Message body (HTML content)"
        source_field: body
      author_id:
        type: string
        required: false
        description: "Author user ID"
        source_field: author_id
      author_name:
        type: string
        required: false
        description: "Author display name"
        source_field: author_id
      message_type:
        type: string
        required: false
        description: "email, comment, notification, auto_comment, user_notification"
        source_field: message_type
      subtype_id:
        type: string
        required: false
        description: "Message subtype"
        source_field: subtype_id
      date:
        type: datetime
        required: false
        description: "Message date"
        source_field: date
      created_at:
        type: datetime
        required: false
      updated_at:
        type: datetime
        required: false

# ============================================================
# RELATIONSHIPS
# ============================================================
relationships:

  # Sales User owns Accounts
  - id: sales_user__account
    from_entity: sales_user
    to_entity: account
    cardinality: "1:N"
    label: "owns/manages"
    join:
      from_field: source_record_id
      to_field: owner_id
    description: "A sales user can own/manage multiple accounts"

  # Sales User belongs to Sales Team
  - id: sales_user__sales_team
    from_entity: sales_team
    to_entity: sales_user
    cardinality: "1:N"
    label: "has members"
    join:
      from_field: source_record_id
      to_field: team_id
    description: "A sales team has multiple members"

  # Account has Contacts
  - id: account__contact
    from_entity: account
    to_entity: contact
    cardinality: "1:N"
    label: "has contacts"
    join:
      from_field: source_record_id
      to_field: account_id
    description: "An account has multiple contacts"

  # Account has Opportunities
